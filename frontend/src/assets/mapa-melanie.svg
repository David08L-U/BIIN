<svg class="w-full h-full object-cover transition-transform duration-300" id="city-map-svg" preserveAspectRatio="xMidYMid slice" viewBox="0 0 480 720" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Refined Route Glow -->
<filter height="140%" id="route-glow" width="140%" x="-20%" y="-20%">
<feDropShadow dx="0" dy="1.5" flood-color="#FDAE3F" flood-opacity="0.38" stdDeviation="3.5"></feDropShadow>
</filter>
<!-- Map Urban Grid Hatch -->
<pattern height="36" id="urban-block-pattern" patternUnits="userSpaceOnUse" width="36">
<rect fill="#FBF6EE" height="32" rx="4" width="32"></rect>
</pattern>
</defs>
<!-- Background Urban Base -->
<rect fill="#F5EFE6" height="100%" width="100%"></rect>
<!-- Stylized Merida Neighborhood Polygons -->
<path d="M 20,40 L 220,20 L 240,220 L 30,210 Z" fill="#FCFAF5" opacity="0.95"></path>
<path d="M 230,30 L 460,40 L 450,260 L 250,230 Z" fill="#FAF6EE" opacity="0.95"></path>
<path d="M 40,240 L 240,250 L 220,520 L 20,500 Z" fill="#F8F3EA" opacity="0.95"></path>
<path d="M 260,260 L 460,280 L 470,540 L 240,530 Z" fill="#FAF5ED" opacity="0.95"></path>
<path d="M 30,530 L 460,560 L 450,710 L 20,700 Z" fill="#F6F0E7" opacity="0.9"></path>
<!-- Urban Blocks Lattice -->
<rect fill="url(#urban-block-pattern)" height="120" opacity="0.65" width="150" x="50" y="70"></rect>
<rect fill="url(#urban-block-pattern)" height="130" opacity="0.65" width="160" x="270" y="90"></rect>
<rect fill="url(#urban-block-pattern)" height="180" opacity="0.65" width="140" x="60" y="280"></rect>
<rect fill="url(#urban-block-pattern)" height="190" opacity="0.65" width="170" x="270" y="310"></rect>
<!-- Green Spaces (Parks) -->
<!-- Parque La Plancha -->
<rect fill="#E1E9D7" height="50" rx="10" width="65" x="250" y="190"></rect>
<text class="font-label-sm" fill="#4B5B3A" font-size="7.5" font-weight="700" letter-spacing="0.6" x="254" y="218">LA PLANCHA</text>
<!-- San Cristóbal / Mejorada Green Patches -->
<circle cx="160" cy="270" fill="#E2EAD8" r="18"></circle>
<text class="font-label-sm" fill="#4B5B3A" font-size="7" font-weight="600" x="135" y="273">Mejorada</text>
<circle cx="180" cy="380" fill="#E2EAD8" r="14"></circle>
<text class="font-label-sm" fill="#4B5B3A" font-size="6.5" font-weight="600" x="145" y="405">San Cristóbal</text>
<!-- Secondary Streets Network -->
<g stroke="#EDE3D5" stroke-linecap="round" stroke-width="2.5">
<line x1="20" x2="460" y1="120" y2="120"></line>
<line x1="30" x2="450" y1="160" y2="160"></line>
<line x1="20" x2="460" y1="310" y2="310"></line>
<line x1="30" x2="450" y1="360" y2="360"></line>
<line x1="20" x2="460" y1="420" y2="420"></line>
<line x1="20" x2="460" y1="470" y2="470"></line>
<line x1="100" x2="100" y1="30" y2="690"></line>
<line x1="150" x2="150" y1="30" y2="690"></line>
<line x1="330" x2="330" y1="30" y2="690"></line>
<line x1="390" x2="390" y1="30" y2="690"></line>
</g>
<!-- Primary Yucatecan Avenues (Limestone Warm Stone) -->
<!-- Paseo de Montejo -->
<path d="M 215,30 L 215,240" stroke="#E2D4C3" stroke-linecap="round" stroke-width="8"></path>
<path d="M 215,30 L 215,240" stroke="#FFFFFF" stroke-dasharray="8 6" stroke-width="2"></path>
<text class="font-label-sm" fill="#7C6D68" font-size="7.5" font-weight="700" letter-spacing="1" x="135" y="85">PASEO DE MONTEJO</text>
<!-- Calle 60 (Centro Histórico spine) -->
<path d="M 215,240 L 215,550" stroke="#E2D4C3" stroke-linecap="round" stroke-width="7"></path>
<text class="font-label-sm" fill="#7C6D68" font-size="7" font-weight="600" transform="rotate(-90 175 470)" x="175" y="470">CALLE 60 SUR</text>
<!-- Calle 59 Transversal -->
<line stroke="#E2D4C3" stroke-width="6" x1="30" x2="450" y1="335" y2="335"></line>
<text class="font-label-sm" fill="#7C6D68" font-size="7" font-weight="600" x="50" y="328">CALLE 59 OESTE</text>
<!-- Anillo Periférico Exterior -->
<path d="M 20,600 C 180,620 320,610 460,630" fill="none" stroke="#DAC6AC" stroke-linecap="round" stroke-width="10"></path>
<text class="font-label-sm" fill="#653E00" font-size="7.5" font-weight="700" x="320" y="622">PERIFÉRICO ORIENTE</text>
<!-- OUTSTANDING TRANSPORT ROUTE: Mérida - Izamal / Teya (Refined Warm Amber / Gold) -->
<path d="M 215,335 C 240,290 260,250 280,225 C 310,195 350,220 375,280 C 400,340 370,410 395,480 C 415,530 435,590 445,640" fill="none" filter="url(#route-glow)" id="golden-transit-route" stroke="#FDAE3F" stroke-linecap="round" stroke-linejoin="round" stroke-width="5.5"></path>
<!-- Inner crisp fiber thread for regional texture -->
<path d="M 215,335 C 240,290 260,250 280,225 C 310,195 350,220 375,280 C 400,340 370,410 395,480 C 415,530 435,590 445,640" fill="none" stroke="#C87A18" stroke-dasharray="6 4" stroke-linecap="round" stroke-width="1.5"></path>
<!-- Route Direction Badge Indicator -->
<g transform="translate(390, 390)">
<rect fill="#2B1810" height="19" rx="5" width="72" x="0" y="0"></rect>
<text class="font-label-sm" fill="#FAF3EB" font-size="7" font-weight="700" text-anchor="middle" x="36" y="12.5">Ruta Izamal / Teya</text>
</g>
</svg>