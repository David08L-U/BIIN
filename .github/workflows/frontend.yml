name: Frontend BIIN
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --deny-warnings
      - run: npm test
      - run: npm run build
      - run: npm run test:pwa
